- title: Research Experiences
  type: time_table
  contents:
    - title: Domain Generalisable Wi-Fi-Based RFFI
      institution: Queen's University Belfast
      year: Jan 2025-Present
      description:
        - Developed a domain generalisable RFFI system capable of identifying Wi-Fi devices in previously unseen environments, addressing cross-environment robustness challenges caused by multipath propagation and channel-induced distortions.
        - Demonstrated the system live at Mobile World Congress (MWC) 2026 Barcelona, processing over 52,000 inference packets in real-time and achieving 92% overall accuracy without prior exposure to the exhibition hall environment.
        - Built a real-time prototype using USRP N210 SDR and multiple Wi-Fi dongles (9 devices across 3 brands) with deep learning-based device classification.

